services:
  db-dumper:
    image: ghcr.io/cplieger/db-dumper:latest
    container_name: db-dumper
    restart: unless-stopped
    user: "0:0"  # required for docker socket access

    environment:
      TZ: "Europe/Paris"
      DB_SPECS: "postgres-container:mydb:postgres"
      DUMP_TIMEOUT: "300"
      DUMP_FREE_KB_WARN: "1048576"

    ports:
      - "9847:9847"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "/opt/appdata/db-dumper/dumps:/dumps"
